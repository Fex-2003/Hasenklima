[platformio]
default_envs = klima_esp32

[env:klima_esp32]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Isrc
lib_deps = paulstoffregen/OneWire@2.3.8

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c++17 -Wall -Wextra -Isrc
test_framework = custom
test_build_src = yes
build_src_filter =
    -<*>
    +<domain/>
    +<storage/Identification.cpp>
    +<storage/RecordFormat.cpp>
    +<storage/PersistenceFormat.cpp>
    +<network/JsonWriter.cpp>
